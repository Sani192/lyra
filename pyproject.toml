[project]
name = "lyra"
version = "0.1.0"
description = "AI Voice Orchestration Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Lyra Architecture Team", email = "architecture@lyra.example" }
]
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.18.0",
    "uvicorn>=0.22.0",
    "asyncpg>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.4.0",
    "ruff>=0.0.280",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
